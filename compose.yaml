services:
  postgres:
    image: postgres:15
    container_name: mr-postgres
    environment:
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: 'psql -c "\l" postgres postgres'
      start_period: 5s
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/create_db.sql:/docker-entrypoint-initdb.d/myresearch.sql

  nginx-dev: &nginx-dev
    image: nginx:latest
    container_name: mr-nginx-dev
    hostname: mr-nginx
    restart: unless-stopped
    profiles: ["dev"]
    depends_on:
      - django-dev
    volumes:
      - ./nginx.conf.dev:/etc/nginx/nginx.conf:ro
    ports:
      - "5000:80"

  nginx-prod:
    <<: *nginx-dev
    container_name: mr-nginx-prod
    profiles: ["prod"]
    depends_on:
      - django-prod
    volumes:
      - ./nginx.conf.prod:/etc/nginx/nginx.conf:ro
      - basta:/var/www/backend_static

  django-dev: &django-dev
    image: mr-django
    container_name: mr-django-dev
    hostname: mr-django
    depends_on:
      postgres:
        condition: service_healthy
    restart: no
    profiles: ["dev"]
    build:
      context: ./backend
    healthcheck:
      test: "curl -f localhost:8000/backend/healthcheck/"
    volumes:
      - ./backend:/usr/src/app/backend
      - bapyca:/usr/src/app/backend/__pycache__
    expose:
      - "8000"
    command: sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "
    ports:
      - "8000:8000"
    environment:
      DB_HOST: 'mr-postgres'
      DJANGO_SETTINGS_MODULE: "myresearch.settings.dev"

  django-prod:
    <<: *django-dev
    container_name: mr-django-prod
    restart: unless-stopped
    profiles: ["prod"]
    volumes:
      - basta:/var/www/backend-static/
    command: sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --no-input &&
      gunicorn --timeout 300 --reload -b 0.0.0.0:8000 myresearch.wsgi:application
      "
    environment:
      DB_HOST: 'mr-postgres'
      DJANGO_SETTINGS_MODULE: "myresearch.settings.prod"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}

  vue-dev:
    image: mr-vue-dev
    container_name: mr-vue-dev
    hostname: mr-vue
    restart: no
    profiles: ["dev"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    entrypoint: ./start_dev.sh
    depends_on:
      django-dev:
        condition: service_healthy
    expose:
      - "3000"
    ports:
      - "3000:3000"
    volumes:
      # Enable live-reloading of frontend code.
      - ./frontend:/app
      # Use container's node_modules.
      - frontend-node-modules:/app/node_modules
    environment:
      # Allows Nuxt to be accessible from the outside.
      - HOST=0.0.0.0
      - CODEGEN_SCHEMA=http://mr-django:8000/backend/api/graphql
      - NUXT_PUBLIC_API_URL=http://localhost:5000/backend/api

  vue-prod:
    image: mr-vue-prod
    container_name: mr-vue-prod
    hostname: mr-vue
    restart: unless-stopped
    profiles: ["prod"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod

  dev-idp:
    image: ghcr.io/centrefordigitalhumanities/development-idp/development-idp:latest
    ports:
      - "7000:7000"
    environment:
      - DJANGO_SECRET_KEY=django-insecure-lb=q@u4df-x0th(5u%$eye_ti#etst+5z+%2=lrh$$le3&v_y$
      - DJANGO_DEBUG=False
      - DJANGO_DEBUG_TOOLBAR=True
      - DJANGO_HOST=localhost:7000
      - DJANGO_ALLOWED_HOSTS=dev-idp,localhost,127.0.0.1
      - DJANGO_DB_TYPE=sqlite3
      - DJANGO_SQLLITE_FILE=/run/db/db.sqlite3
      - DJANGO_HTTPS=False

      - DJANGO_IDP_PRIVATE_KEY=/run/secrets/private_key
      - DJANGO_IDP_PUBLIC_CERT=/run/secrets/public_cert
    volumes:
      - ./db:/run/db
    profiles:
      ["dev"]
    stdin_open: true
    tty: true
    restart: unless-stopped
    secrets:
      - private_key
      - public_cert

volumes:
  frontend-node-modules:
  pgdata:
  bapyca:
  basta:

networks:
    my-research:
      driver: bridge

secrets:
  private_key:
    file: ./certificates/private.key
  public_cert:
    file: ./certificates/public.cert
